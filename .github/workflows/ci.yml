name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm -F @reflow/conformance exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          REFLOW_RUNS: '120'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: packages/conformance/report/
