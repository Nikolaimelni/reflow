<!doctype html>
<meta charset="utf-8" />
<title>margin collapsing in every direction</title>
<style>
  body {
    margin: 0;
  }
  .a {
    height: 20px;
    margin-bottom: 30px;
  }
  .b {
    height: 20px;
    margin-top: 10px;
  }
  .empty {
    margin: 25px 0;
  }
  .parent {
    margin-top: 40px;
  }
  .child {
    margin-top: 15px;
    height: 10px;
  }
  .bfc {
    overflow: hidden;
    margin-top: 12px;
  }
  .in-bfc {
    margin-top: 22px;
    height: 10px;
  }
  .padded {
    padding-top: 1px;
    margin-top: 9px;
  }
  .in-padded {
    margin-top: 33px;
    height: 10px;
  }
  .negative {
    height: 10px;
    margin-top: -12px;
  }
  .last {
    height: 10px;
    margin-bottom: 60px;
  }
  .after-nothing {
    height: 10px;
    margin-top: 18px;
  }
  .marked {
    display: inline;
    padding-left: 4px;
  }
  .out-of-the-way {
    position: absolute;
  }
  .through-the-cut {
    height: 10px;
    margin-top: 14px;
  }
  .pulled {
    display: inline;
    margin: -12px;
  }
  .floored {
    min-height: 10px;
  }
  .barely-floored {
    min-height: 2px;
  }
  .capped {
    max-height: 3px;
  }
  .short-with-margin {
    height: 5px;
    margin-bottom: 12px;
  }
  .sinking {
    margin-bottom: -12px;
  }
  .aligned {
    align-content: stretch;
  }
  .spacer {
    height: 20px;
  }
</style>
<div class="a"></div>
<div class="empty"></div>
<div class="b"></div>
<div class="parent"><div class="child"></div></div>
<div class="bfc"><div class="in-bfc"></div></div>
<div class="padded"><div class="in-padded"></div></div>
<div class="negative"></div>
<div class="last"></div>
<div><span></span><div class="after-nothing"></div></div>
<div><span class="marked"></span><div class="after-nothing"></div></div>
<div><span class="pulled"></span><div class="after-nothing"></div></div>
<div>
  <em>
    <div class="out-of-the-way"></div>
    <div class="through-the-cut"></div>
  </em>
</div>
<div class="spacer"></div>
<div class="barely-floored"><div class="short-with-margin"></div></div>
<div class="spacer"></div>
<div class="floored"><div class="short-with-margin"></div></div>
<div class="spacer"></div>
<div class="capped"><div class="short-with-margin"></div></div>
<div class="spacer"></div>
<div class="barely-floored"><div class="sinking"></div></div>
<div class="spacer"></div>
<div class="barely-floored"><div class="sinking aligned"></div></div>
<div class="spacer"></div>
