<!doctype html>
<meta charset="utf-8" />
<title>gaps between flex items and between flex lines</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 400px;
  }
  .row {
    display: flex;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .row > div {
    height: 20px;
  }
  .fixed {
    width: 60px;
  }
  .grows {
    flex-grow: 1;
  }
  .shrinks {
    width: 300px;
  }
  .apart {
    gap: 12px;
  }
  .kept {
    white-space: pre;
  }
  .out {
    position: absolute;
  }
  .apart-both-ways {
    gap: 7px 13px;
  }
  .apart-by-share {
    gap: 5%;
  }
  .spaced {
    justify-content: space-between;
  }
  .ending {
    justify-content: flex-end;
  }
  .back {
    flex-direction: row-reverse;
  }
  .wrapping {
    flex-wrap: wrap;
  }
  .other-way {
    flex-wrap: wrap-reverse;
  }
  .wide-item {
    width: 120px;
    height: 14px;
    background-color: #d8c8e8;
  }
  .tall {
    height: 120px;
  }
  .packed-start {
    align-content: flex-start;
  }
  .packed-end {
    align-content: flex-end;
  }
  .packed-middle {
    align-content: center;
  }
  .packed-between {
    align-content: space-between;
  }
  .packed-around {
    align-content: space-around;
  }
  .packed-evenly {
    align-content: space-evenly;
  }
  .packed-stretch {
    align-content: stretch;
  }
  .centred {
    justify-content: center;
  }
  .crammed {
    width: 100px;
  }
  .crammed > div {
    width: 80px;
    flex: none;
  }
  .short {
    height: 60px;
  }
  .overfull > div {
    height: 50px;
  }
  .column {
    display: flex;
    flex-direction: column;
    height: 120px;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .column > div {
    width: 40px;
  }
  .stretchy > div {
    height: auto;
  }
</style>

<div class="row apart"><div class="fixed"></div><div class="fixed"></div></div>
<div class="row apart"><div class="fixed"></div><div class="grows"></div></div>

  <div class="wide-item"></div>

<div class="row wrapping apart tall packed-around">
