<!doctype html>
<meta charset="utf-8" />
<title>an inline box's own edges take room on the line</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 180px;
  }
  div,
  p {
    margin: 0;
  }
  .wide {
    display: inline;
    margin: 46px;
    background-color: #dce6f5;
  }
  .padded {
    display: inline;
    padding-right: 40px;
    border-right: 6px solid;
    background-color: #f5e6dc;
  }
  .crossing {
    display: inline;
    background-color: #f0e2f0;
  }
  .after {
    display: inline-block;
    width: 12px;
    height: 12px;
    background-color: #444;
  }
  .narrow {
    width: 23px;
    font-size: 9px;
  }
  .edged {
    border: 1px solid;
  }
  .roomy {
    width: 180px;
  }
  .padded-inline {
    display: inline;
    padding-left: 16px;
    font-size: 9px;
    background-color: #dce6f5;
  }
  .percent-edged {
    margin: 4%;
    padding-left: 18%;
    background-color: #f3e2f3;
  }
  .held {
    display: inline;
    padding-right: 30px;
    white-space: nowrap;
    background-color: #e6f0e6;
  }
  .pulls-back {
    display: inline-block;
    width: 0;
    margin: -12px;
  }
  .indented {
    margin-left: 50px;
  }
  .cancelled-out {
    display: inline;
    margin: -12px;
    padding-left: 12px;
    white-space: pre;
  }
  .side-padded {
    padding: 0 5px;
  }
</style>

<div class="wide">
  one one one
</div>

<p>start <span class="padded">and the closing padding has to fit </span>after</p>

<p>start <span class="held">a run that will not break </span>after</p>

<div class="crossing">
  one
</div>
<div class="after"></div>

<div class="narrow">one a <em class="edged"></em></div>

<div><em class="percent-edged">internationalisation</em></div>

<div class="roomy">internationalisation one <div class="padded-inline"></div></div>
<div class="roomy">internationalisation one <em class="padded-inline"></em></div>
<div class="indented"><span><span class="pulls-back"></span></span></div>
<div class="indented"><span>ab<span class="pulls-back"></span></span></div>
<div class="indented"><span><span class="pulls-back"></span>ab</span></div>
<div class="indented"><span class="side-padded"><span class="pulls-back"></span></span></div>
<div class="indented"><span><span class="pulls-back"></span></span>tail</div>
<div><div class="cancelled-out">
  one
</div></div>
