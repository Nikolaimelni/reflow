<!doctype html>
<meta charset="utf-8" />
<title>shrink to fit on inline blocks</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 300px;
  }
  p {
    margin: 0 0 6px;
  }
  .ib {
    display: inline-block;
  }
  .capped {
    display: inline-block;
    max-width: 60px;
  }
  .padded {
    display: inline-block;
    padding: 4px;
    border: 2px solid;
  }
  .floor {
    display: inline-block;
    min-width: 200px;
  }
  .tall-frame {
    height: 40px;
  }
  .loose-frame {
    background-color: #f0f0e8;
  }
  .half-height {
    display: inline-block;
    width: 30px;
    height: 50%;
    background-color: #dce6f5;
  }
  .holds-an-absolute {
    position: absolute;
    top: 240px;
    border: 1px solid;
  }
  .held-inside {
    white-space: nowrap;
  }
  .out-of-flow {
    position: absolute;
    width: 90px;
    height: 8px;
    background-color: #d8c8a8;
  }
</style>
<p><span class="ib">short</span></p>
<p><span class="ib">a much longer run of words that will not fit on a single line in this box</span></p>
<p><span class="capped">narrow words here</span></p>
<p><span class="padded">padded box</span></p>
<p><span class="floor">wide floor</span></p>
<p>text <span class="ib">middle</span> text</p>
<div class="holds-an-absolute"><div class="out-of-flow"></div></div>

<div class="tall-frame"><span class="half-height">one</span></div>
<div class="loose-frame"><span class="half-height">one</span></div>
<div>
  <span class="ib">
    one
    <span class="held-inside">
      one
    </span>
  </span>
</div>
