<!doctype html>
<meta charset="utf-8" />
<title>percentage edges on an absolutely positioned box</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 180px;
  }
  .empty,
  .sized,
  .worded {
    position: absolute;
    padding: 1%;
    background-color: #dce6f5;
  }
  .empty {
    box-sizing: border-box;
    min-height: 2px;
  }
  .sized {
    top: 40px;
    width: 30%;
    height: 12px;
  }
  .worded {
    top: 80px;
    left: 10%;
  }
</style>

<div class="empty"></div>
<div class="sized"></div>
<div class="worded">two words</div>
