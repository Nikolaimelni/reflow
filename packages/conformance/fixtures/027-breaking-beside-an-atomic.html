<!doctype html>
<meta charset="utf-8" />
<title>where a line may break beside an atomic inline</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 180px;
  }
  .wide {
    display: inline-block;
    width: 200px;
    height: 10px;
    background-color: #dce6f5;
  }
  .narrow {
    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: #f0e2c8;
  }
  .made-inline {
    display: inline;
  }
  .padded {
    padding-left: 5px;
  }
  .kept {
    white-space: nowrap;
  }
  .edges-only {
    display: inline;
    margin: 12px;
    padding: 8px;
    padding-left: 65%;
  }
  .small {
    display: inline-block;
    padding-left: 28px;
    border: 2px solid;
  }
  .framed {
    display: inline;
    margin: 16px;
    padding-left: 19px;
    border: 4px solid;
  }
  .words {
    display: inline-block;
  }
  .empty-padded {
    padding: 19%;
  }
  .deep-framed {
    display: inline;
    padding-left: 71px;
    border: 5px solid;
  }
  .wide-start {
    display: inline-block;
    padding-left: 74%;
  }
  .short-start {
    display: inline;
    padding-left: 6%;
  }
  .tall {
    display: inline-block;
    padding: 22px;
    border: 2px solid;
  }
  .framed-empty {
    display: inline;
    border: 1px solid;
  }
  .opened {
    display: inline;
    padding-left: 10px;
  }
  .pushed {
    padding-left: 10px;
  }
  .small-atomic {
    display: inline-block;
    width: 20px;
    height: 10px;
    background-color: #e8d8c8;
  }
</style>

<div>a<span class="wide"></span></div>
<div>a<span></span><span class="wide"></span></div>
<div><span class="narrow"></span><span class="wide"></span></div>
<div><span class="wide"></span>word</div>
<div><div class="made-inline"></div><span class="wide"></span></div>
<div><section class="made-inline"></section><span class="wide"></span></div>
<div><em></em><span class="wide"></span></div>
<div><span class="padded"></span><span class="wide"></span></div>
<div><div class="made-inline"></div> <span class="wide"></span> more</div>
<div class="kept"><div class="made-inline"></div><span class="wide"></span></div>
<div>
  <div class="made-inline"></div>
  <div class="tall">internationalisation</div>
</div>
<div>
  <div class="small"></div>
  <div class="edges-only"></div>
</div>
<div>
  <div class="words">
    liquorice one
  </div>
  <div class="framed">
    one
  </div>
</div>
<div>
  <div class="narrow"></div>
  <em class="empty-padded"></em>
  <div class="deep-framed">
    one
  </div>
</div>
<div><span class="wide-start">three</span><span class="short-start">
    one
  </span></div>
<div><div class="framed-empty"></div><div class="opened"><span class="wide"></span></div></div>
<div><div class="framed-empty"></div><span class="pushed"><span class="wide"></span></span></div>
<div>
  <div class="opened">
    <span class="wide"></span>
  </div>
</div>
<div><div class="framed-empty"></div><span><div class="opened"><span class="wide"></span></div></span></div>
<div>x<div class="opened"><span class="wide"></span></div></div>
<div>x<span class="pushed"><span class="wide"></span></span></div>
<div><span class="small-atomic"></span><div class="opened"><span class="wide"></span></div></div>
