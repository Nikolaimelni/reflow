<!doctype html>
<meta charset="utf-8" />
<title>single line flexbox</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 400px;
  }
  .row {
    display: flex;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .row > div {
    height: 20px;
  }
  .fixed {
    width: 60px;
  }
  .grows {
    flex-grow: 1;
  }
  .grows-twice {
    flex-grow: 2;
  }
  .basis {
    flex-basis: 80px;
  }
  .nogrow {
    flex: none;
    width: 50px;
  }
  .shrinks {
    width: 300px;
    flex-shrink: 1;
  }
  .shrinks-hard {
    width: 300px;
    flex-shrink: 3;
  }
  .spaced {
    justify-content: space-between;
  }
  .around {
    justify-content: space-around;
  }
  .evenly {
    justify-content: space-evenly;
  }
  .middle {
    justify-content: center;
  }
  .ending {
    justify-content: flex-end;
  }
  .tall {
    height: 60px;
  }
  .stretchy {
    align-items: stretch;
  }
  .topped {
    align-items: flex-start;
  }
  .bottomed {
    align-items: flex-end;
  }
  .centred {
    align-items: center;
  }
  .auto-height > div {
    height: auto;
  }
  .padded > div {
    padding: 4px;
    border: 2px solid;
    margin: 3px;
  }
  .column {
    display: flex;
    flex-direction: column;
    height: 120px;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .column > div {
    width: 40px;
  }
  .flattened {
    width: 20px;
    height: 0;
    min-height: 6px;
    background-color: #d8c8a8;
  }
  .narrowed {
    width: 0;
    min-width: 8px;
    height: 10px;
    background-color: #a8c8d8;
  }
  .back {
    flex-direction: row-reverse;
  }
  .wrapping {
    flex-wrap: wrap;
  }
  .narrow {
    width: 180px;
    font-size: 23px;
    background-color: #e8e8d8;
  }
  .other-way {
    flex-wrap: wrap-reverse;
  }
  .hanging {
    margin-bottom: 6px;
    margin-top: 2px;
  }
  .pushed {
    margin-left: auto;
  }
  .sunken {
    margin-top: auto;
  }
  .floating {
    margin-top: auto;
    margin-bottom: auto;
  }
  .middled {
    margin-left: auto;
    margin-right: auto;
  }
  .wide-item {
    width: 120px;
    height: 14px;
    background-color: #d8c8e8;
  }
  .column.back {
    flex-direction: column-reverse;
  }
  .low {
    align-self: flex-end;
  }
  .middle {
    align-self: center;
  }
  .tallest {
    align-self: stretch;
  }
  .percent-padded {
    padding: 1%;
    background-color: #c8d8a8;
  }
  .clips,
  .keeps {
    flex-basis: 0;
    background-color: #d8a8c8;
  }
  .clips {
    overflow: hidden;
  }
  .kept {
    white-space: pre;
  }
  .item {
    background-color: #e8d8c8;
  }
  .none-wide {
    width: 0%;
    background-color: #a8d8c8;
  }
  .barely-wide {
    width: 4px;
    background-color: #d8d8a8;
  }
  .sunk {
    margin-bottom: 3%;
    background-color: #c8d8e8;
  }
</style>

<div class="row"><div class="fixed"></div><div class="grows"></div></div>
<div class="row"><div class="grows"></div><div class="grows-twice"></div></div>
<div class="row"><div class="basis"></div><div class="grows"></div><div class="nogrow"></div></div>
<div class="row"><div class="shrinks"></div><div class="shrinks-hard"></div></div>
<div class="row spaced"><div class="fixed"></div><div class="fixed"></div><div class="fixed"></div></div>
<div class="row around"><div class="fixed"></div><div class="fixed"></div></div>
<div class="row evenly"><div class="fixed"></div><div class="fixed"></div></div>
<div class="row middle"><div class="fixed"></div><div class="fixed"></div></div>
<div class="row ending"><div class="fixed"></div></div>
<div class="row tall stretchy auto-height"><div class="fixed"></div><div class="grows"></div></div>
<div class="row tall topped"><div class="fixed"></div></div>
<div class="row tall bottomed"><div class="fixed"></div></div>
<div class="row tall centred"><div class="fixed"></div></div>
<div class="row padded"><div class="fixed"></div><div class="grows"></div></div>
<div class="column"><div class="fixed"></div><div class="grows"></div></div>
<div class="row"><div class="flattened"></div><div class="fixed"></div></div>
<div class="column"><div class="narrowed"></div></div>
<div class="row"><div class="percent-padded">one</div></div>
<div class="row"><div class="clips">one</div><div class="fixed"></div></div>
<div class="row kept">
  <div class="fixed"></div>
</div>
<div class="row"><div class="item"><div class="sunk">one one</div></div></div>
<div class="row back"><div class="fixed"></div><div class="grows"></div></div>
<div class="row back spaced"><div class="fixed"></div><div class="fixed"></div></div>
<div class="column back"><div class="fixed"></div><div class="grows"></div></div>
<div class="row tall topped">
  <div class="fixed"></div>
  <div class="fixed low"></div>
  <div class="fixed middle"></div>
  <div class="grows tallest"></div>
</div>
<div class="row wrapping">
  <div class="wide-item"></div>
  <div class="wide-item"></div>
  <div class="wide-item"></div>
</div>
<div class="row wrapping other-way">
  <div class="wide-item"></div>
  <div class="wide-item"></div>
  <div class="wide-item"></div>
</div>
<div class="row wrapping"><div class="wide-item grows"></div><div class="wide-item"></div></div>
<div class="row"><div class="fixed"></div><div class="fixed pushed"></div></div>
<div class="row tall"><div class="fixed sunken"></div><div class="fixed floating"></div></div>
<div class="row"><div class="fixed middled"></div></div>
<div class="column wrapping narrow">internationalisation three one</div>
<div class="row wrapping other-way"><div class="fixed hanging"></div></div>
<div class="row wrapping other-way tall"><div class="fixed hanging"></div><div class="fixed"></div></div>
<div class="column narrow">internationalisation three one</div>
<div class="row"><div class="keeps">one</div><div class="fixed"></div></div>
<div class="row"><div class="none-wide">one</div><div class="fixed"></div></div>
<div class="row"><div class="barely-wide">one</div><div class="fixed"></div></div>
<div class="column"><div class="none-wide">one</div></div>
