<!doctype html>
<meta charset="utf-8" />
<title>single line flexbox</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 400px;
  }
  .row {
    display: flex;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .row > div {
    height: 20px;
  }
  .fixed {
    width: 60px;
  }
  .grows {
    flex-grow: 1;
  }
  .grows-twice {
    flex-grow: 2;
  }
  .basis {
    flex-basis: 80px;
  }
  .nogrow {
    flex: none;
    width: 50px;
  }
  .shrinks {
    width: 300px;
    flex-shrink: 1;
  }
  .shrinks-hard {
    width: 300px;
    flex-shrink: 3;
  }
  .spaced {
    justify-content: space-between;
  }
  .around {
    justify-content: space-around;
  }
  .evenly {
    justify-content: space-evenly;
  }
  .middle {
    justify-content: center;
  }
  .ending {
    justify-content: flex-end;
  }
  .tall {
    height: 60px;
  }
  .stretchy {
    align-items: stretch;
  }
  .topped {
    align-items: flex-start;
  }
  .bottomed {
    align-items: flex-end;
  }
  .centred {
    align-items: center;
  }
  .auto-height > div {
    height: auto;
  }
  .padded > div {
    padding: 4px;
    border: 2px solid;
    margin: 3px;
  }
  .column {
    display: flex;
    flex-direction: column;
    height: 120px;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .column > div {
    width: 40px;
  }
  .flattened {
    width: 20px;
    height: 0;
    min-height: 6px;
    background-color: #d8c8a8;
  }
  .narrowed {
    width: 0;
    min-width: 8px;
    height: 10px;
    background-color: #a8c8d8;
  }
  .back {
    flex-direction: row-reverse;
  }
  .wrapping {
    flex-wrap: wrap;
  }
  .narrow {
    width: 180px;
    font-size: 23px;
    background-color: #e8e8d8;
  }
  .other-way {
    flex-wrap: wrap-reverse;
  }
  .hanging {
    margin-bottom: 6px;
    margin-top: 2px;
  }
  .pushed {
    margin-left: auto;
  }
  .sunken {
    margin-top: auto;
  }
  .floating {
    margin-top: auto;
    margin-bottom: auto;
  }
  .middled {
    margin-left: auto;
    margin-right: auto;
  }
  .wide-item {
    width: 120px;
    height: 14px;
    background-color: #d8c8e8;
  }
  .column.back {
    flex-direction: column-reverse;
  }
  .low {
    align-self: flex-end;
  }
  .middle {
    align-self: center;
  }
  .tallest {
    align-self: stretch;
  }
  .percent-padded {
    padding: 1%;
    background-color: #c8d8a8;
  }
  .clips,
  .keeps {
    flex-basis: 0;
    background-color: #d8a8c8;
  }
  .clips {
    overflow: hidden;
  }
  .kept {
    white-space: pre;
  }
  .item {
    background-color: #e8d8c8;
  }
  .none-wide {
    width: 0%;
    background-color: #a8d8c8;
  }
  .barely-wide {
    width: 4px;
    background-color: #d8d8a8;
  }
  .lopsided {
    margin-left: 4px;
    margin-right: 6px;
    background-color: #a8b8d8;
  }
  .lopsided-down {
    margin-top: 4px;
    margin-bottom: 6px;
    background-color: #a8b8d8;
  }
  .pushed-back {
    margin-bottom: auto;
  }
  .small-print {
    font-size: 9px;
    background-color: #e8c8c8;
  }
  .large-print {
    font-size: 23px;
    background-color: #c8e8c8;
  }
  .half-grows {
    flex-grow: 0.5;
    flex-basis: 0;
  }
  .floored-grows {
    flex: 1 1 0;
    min-width: 100px;
  }
  .open-column {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .open-column > div {
    background-color: #d8e8c8;
  }
  .shares {
    flex: 1;
  }
  .shares-from-nothing {
    flex: 1 1 0;
  }
  .half-basis {
    flex-basis: 50%;
  }
  .sized-whole {
    box-sizing: border-box;
    width: 100px;
    padding: 10px;
    border: 2px solid;
    flex-shrink: 0;
  }
  .sized-whole-down {
    box-sizing: border-box;
    height: 50px;
    padding: 10px;
    border: 2px solid;
    flex-shrink: 0;
  }
  .basis-alone {
    flex: 10px;
  }
  .basis-first {
    flex: 30% 2;
  }
  .on-baseline {
    align-items: baseline;
  }
  .nudged-down {
    margin-top: 1%;
  }
  .boxed-in {
    padding: 6px;
    border: 3px solid;
    height: 10px;
    width: 10px;
  }
  .lowered {
    margin-top: 12px;
  }
  .large {
    font-size: 30px;
  }
  .wide-left {
    padding: 7px;
    padding-left: 59%;
    border: 1px solid;
    font-size: 18px;
  }
  .middle-across {
    align-items: center;
  }
  .no-wider {
    max-width: 0%;
    background-color: #d8a8a8;
  }
  .capped-across {
    max-height: 12px;
    background-color: #a8d8a8;
  }
  .floored-across {
    min-width: 150px;
    background-color: #a8a8d8;
  }
  .centred-by-margins {
    margin: auto;
    align-self: baseline;
    width: 10px;
    height: 6px;
    background-color: #d8c8e8;
  }
  .just-over {
    padding-left: 24%;
    border: 5px solid;
    flex-basis: 69px;
  }
  .squeezed-wide {
    padding-left: 37%;
    font-size: 20px;
  }
  .held-down {
    max-width: 0%;
    background-color: #c8a8a8;
  }
  .sunk {
    margin-bottom: 3%;
    background-color: #c8d8e8;
  }
</style>
