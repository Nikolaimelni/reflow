<!doctype html>
<meta charset="utf-8" />
<title>a line box that hangs out of its block, under the pointer</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }
  .crowded {
    width: 180px;
    height: 20px;
    background-color: #f0e2c8;
  }
  .fat {
    display: inline-block;
    width: 160px;
    height: 6px;
    background-color: #c8c8d8;
  }
  .kept {
    height: 20px;
    background-color: #dce6f5;
  }
  .middled {
    text-align: center;
  }
  .righted {
    text-align: right;
  }
  .short {
    width: 90px;
  }
  .stubby {
    width: 100px;
    white-space: nowrap;
  }
  .tall-lines {
    width: 100px;
    height: 10px;
    line-height: 40px;
    background-color: #f0e2c8;
  }
  .flat {
    display: inline-block;
    width: 80px;
    height: 4px;
    background-color: #c8c8d8;
  }
  .pulled-back {
    position: relative;
    left: -150px;
    padding: 0 60px;
    background-color: #d8e8c8;
  }
</style>

<div class="crowded">one <span class="fat"></span></div>
<div class="kept"></div>
<div class="crowded middled">one <span class="fat short"></span></div>
<div class="kept"></div>
<div class="crowded righted">one two <span class="fat short"></span></div>
<div class="kept"></div>
<div class="crowded">one two three four five six seven eight nine ten eleven</div>
<div class="kept"></div>
<div class="stubby">xx<span class="pulled-back">yy</span></div>
<div class="kept"></div>
<div class="tall-lines">ab <span class="flat"></span></div>
<div class="kept"></div>
