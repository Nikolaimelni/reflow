<!doctype html>
<meta charset="utf-8" />
<title>a formatting context root keeps its children's margins to itself</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    width: 220px;
  }
  div {
    margin: 0;
  }
  .plain .inner {
    margin-top: 20px;
  }
  .shrunk {
    display: inline-block;
    background-color: #e6eefc;
  }
  .shrunk .inner {
    width: 40px;
    margin-top: 20px;
  }
  .lifted {
    display: inline-block;
    background-color: #fcefe6;
  }
  .lifted .inner {
    width: 40px;
    margin-top: -12px;
  }
  .clips {
    overflow: hidden;
    background-color: #eaf5ea;
  }
  .clips .inner {
    margin-top: 20px;
  }
  .clipped-last {
    display: inline-block;
    background-color: #f5eaf5;
  }
  .clipped-last .clipping {
    overflow: hidden;
    width: 40px;
    margin-top: -12px;
  }
  .clipped-last .clipping.tall {
    height: 10px;
    margin-top: 0;
    margin-bottom: 5px;
  }
  .rule {
    height: 4px;
    background-color: #444;
  }
  .clipped-last .clipping.row {
    display: flex;
  }
  .clipped-last .short {
    height: 6px;
    margin-bottom: 5px;
  }
</style>

<div class="plain">
  <div class="inner rule"></div>
</div>

<div class="shrunk">
  <div class="inner rule"></div>
</div>

<div class="lifted">
  <div class="inner rule"></div>
</div>

<div class="clips">
  <div class="inner rule"></div>
</div>

<div>
  <div class="clipped-last">
    <div class="clipping"></div>
  </div>
</div>

<div>
  x
  <div class="clipped-last">
    <div>above</div>
    <div class="clipping tall"></div>
  </div>
</div>

<div>
  <div class="clipped-last">
    <div class="clipping tall">text</div>
  </div>
</div>

<div>
  x
  <div class="clipped-last">
    <div class="clipping row"></div>
  </div>
  <div class="clipped-last">
    <div class="clipping row"><div>text</div></div>
  </div>
  <div class="clipped-last">
    <div class="clipping row short"><div>text</div></div>
  </div>
</div>
